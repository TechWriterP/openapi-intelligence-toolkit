openapi: 3.1.2
info:
  title: Source Location Spike
  version: 1.0.0
tags:
  - name: pets
paths:
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: string }
      - name: trace
        in: query
        schema: { type: string }
      - name: locale
        in: query
        schema: { type: string }
    get:
      # Important operation
      operationId: getPet
      tags: [pets]
      responses:
        '200':
          description: Identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400':
          description: Identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '200': { description: Identifier }
components:
  schemas:
    Pet:
      type: object
      properties:
        id: { type: string, description: Identifier }
        a/b~c: { type: string }
    Error:
      type: object
      properties:
        message: { type: string, description: Identifier }
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
