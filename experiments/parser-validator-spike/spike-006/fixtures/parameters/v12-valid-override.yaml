openapi: 3.1.2
info:
  title: OAIT Validator Spike API
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
          description: override
      responses:
        "200":
          description: OK
      security:
        - ApiKeyAuth: []
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
components:
  schemas:
    Pet:
      type: object
      required:
        - id
      properties:
        id:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
