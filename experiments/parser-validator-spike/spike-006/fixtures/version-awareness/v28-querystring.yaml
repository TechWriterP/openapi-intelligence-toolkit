openapi: 3.2.0
info:
  title: OAIT Validator Spike API
  version: 1.0.0
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
      security:
        - ApiKeyAuth: []
  /search:
    query:
      operationId: search
      parameters:
        - name: search
          in: querystring
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
      responses:
        "200":
          description: OK
components:
  schemas:
    Pet:
      type: object
      required:
        - id
      properties:
        id:
          type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
